<div class="app-calendar input-group input-group-sm">
  <p-floatlabel variant="on">
    <p-datepicker
         [ngModel]="value()"
         (ngModelChange)="onChanged($event)"
         [inputId]="effectiveId()"
         [readonlyInput]="readonly()"
         [showOnFocus]="!readonly()"
         [ariaLabel]="ariaLabel()"
         [ariaLabelledBy]="labelledBy()"
         [pt]="passThrough()"
         showIcon
         iconDisplay="input"
         [minDate]="minDate()"
         [maxDate]="maxDate()"
         [disabled]="disabled() || readonly()"
         (onBlur)="onClosed()"
    ></p-datepicker>
    <label [for]="effectiveId()">{{ placeholder() || 'On Label' }}</label>
  </p-floatlabel>
</div>
