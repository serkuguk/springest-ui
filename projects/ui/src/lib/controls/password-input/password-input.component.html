<div class="password-wrapper">
  <p-floatlabel>
    <p-password
         type="text"
         class="password-input"
         [disabled]="isDisabled() || disabled()"
         [pt]="passThrough()"
         (input)="onInput($event)"
         (onBlur)="onBlur()"
         [inputId]="effectiveId()"
         [ariaLabel]="ariaLabel()"
         [ariaLabelledBy]="labelledBy()"
         [ngModel]="value()"
         [feedback]="feedback()"
         [autocomplete]="autocomplete()"
         [toggleMask]="toggleMask()"
    />
    <label [for]="effectiveId()">{{ placeholder() }}</label>
  </p-floatlabel>
</div>
