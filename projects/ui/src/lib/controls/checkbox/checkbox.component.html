<div class="checkbox-wrapper">
    <p-checkbox
        [ngModel]="value()"
        [binary]="binary()"
        [disabled]="disabled()"
        [readonly]="readonly()"
        [inputId]="effectiveId()"
        [ariaLabel]="ariaLabel()"
        [ariaLabelledBy]="labelledBy()"
        [pt]="passThrough()"
        (ngModelChange)="onValueChange($event)"
        (onBlur)="onBlur()"
    />
    @if (label()) {
        <label class="checkbox-label" [for]="effectiveId()">{{ label() }}</label>
    }
</div>
