<div class="select_wrapper" [class.select_disabled]="isDisabled() || disabled() || readonly()">
  <p-floatlabel>
    <p-select
      class="select"
      [options]="items()"
      [disabled]="isDisabled() || disabled() || readonly()"
      [readonly]="readonly()"
      [inputId]="effectiveId()"
      [ariaLabel]="ariaLabel()"
      [ariaLabelledBy]="labelledBy()"
      [pt]="passThrough()"
      [placeholder]="placeholder()"
      [resetFilterOnHide]="resetFilterOnHide()"
      [filter]="filter()"
      [showClear]="showClearState()"
      [optionLabel]="optionLabel()"
      [optionValue]="optionValue()"
      [ngModel]="value()"
      (onChange)="onChanged($event)"
      (onBlur)="touched.set(true)"
      (onHide)="onClosed()">
      @if (showIcon()) {
        <ng-template #selectedItem let-selectedOption>
          <div class="flex items-center gap-2">
            <img src="https://primefaces.org/cdn/primeng/images/demo/flag/flag_placeholder.png"
                 [class]="'flag flag-' + value()" style="width: 18px" alt=""/>
            <div>{{ selectedOption.name }}</div>
          </div>
        </ng-template>
        <ng-template let-country #item>
          <div class="flex items-center gap-2">
            <img src="https://primefaces.org/cdn/primeng/images/demo/flag/flag_placeholder.png"
                 [class]="'flag flag-' + country.code.toLowerCase()" style="width: 18px"  alt=""/>
            <div>{{ country.name }}</div>
          </div>
        </ng-template>
      }
    </p-select>
    <label [for]="effectiveId()">{{placeholder()}}</label>
  </p-floatlabel>
</div>
