<div class="form-field" [class.form-field_error]="hasError()" [class.form-field_inline]="isInline()">
  @if (showLabel()) {
    <label class="form-field__label" [id]="labelId()" [for]="controlId()">
      <span class="form-field__label-text">{{ label() }}</span>
      @if (required()) { <span class="form-field__req" aria-hidden="true">*</span> }
    </label>
  }
  <div class="form-field__control">
    <ng-content></ng-content>
    @if (hasError()) {
      <div class="form-field__error" [id]="errorId()" aria-live="polite">{{ errorMessage }}</div>
    }
  </div>
</div>
