<div class="basic-input">
  <p-floatlabel>
    <input
      [type]="type()"
      pInputText
      class="app-input"
      [id]="effectiveId()"
      [disabled]="isDisabled() || disabled()"
      [readOnly]="readonly()"
      [attr.min]="min()"
      [attr.max]="max()"
      [attr.step]="step()"
      [attr.autocomplete]="autocomplete()"
      [attr.autocapitalize]="autocapitalize()"
      [attr.lang]="lang()"
      [attr.spellcheck]="spellcheck()"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-labelledby]="formField ? formField.labelledBy(ariaLabelledBy()) : ariaLabelledBy()"
      [attr.aria-describedby]="formField ? formField.describedBy(ariaDescribedBy()) : ariaDescribedBy()"
      [attr.aria-invalid]="formField ? formField.hasError() : ariaInvalid()"
      (input)="onInput($event)"
      (blur)="onBlur()"
      [value]="value()"
    />
    <label [for]="effectiveId()">{{label() ?? placeholder()}}</label>
  </p-floatlabel>
</div>
